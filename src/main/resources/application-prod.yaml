spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

auth:
  apple:
    client-id: ${APPLE_CLIENT_ID}
    jwks-cache-ttl: ${APPLE_JWKS_CACHE_TTL}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    jwks-cache-ttl: ${GOOGLE_JWKS_CACHE_TTL}
  email-verification:
    code-expiration: ${EMAIL_VERIFICATION_CODE_EXPIRATION}
    verified-expiration: ${EMAIL_VERIFICATION_VERIFIED_EXPIRATION}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN}
    lock-expiration: ${EMAIL_VERIFICATION_LOCK_EXPIRATION}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
  mail:
    sender: ${MAIL_SENDER}

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

auth:
  apple:
    client-id: ${APPLE_CLIENT_ID}
    jwks-cache-ttl: ${APPLE_JWKS_CACHE_TTL}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    jwks-cache-ttl: ${GOOGLE_JWKS_CACHE_TTL}
  email-verification:
    code-expiration: ${EMAIL_VERIFICATION_CODE_EXPIRATION}
    verified-expiration: ${EMAIL_VERIFICATION_VERIFIED_EXPIRATION}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN}
    lock-expiration: ${EMAIL_VERIFICATION_LOCK_EXPIRATION}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
  mail:
    sender: ${MAIL_SENDER}

tour-api:
  service-key: ${TOUR_API_SERVICE_KEY}
  mobile-os: ETC
  mobile-app: KOMME

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

server:
  port: ${PORT:8080}

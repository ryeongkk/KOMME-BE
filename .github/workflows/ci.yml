name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: komme
          MYSQL_USER: komme
          MYSQL_PASSWORD: komme-local-password
          MYSQL_ROOT_PASSWORD: komme-local-root-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pkomme-local-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    # prod 프로필은 이미 모든 설정값이 ${ENV_VAR}로 외부화되어 있어
    # 별도의 CI 전용 yaml 없이 이 env 값들만 채워서 그대로 재사용한다.
    # (코드베이스에 @Profile 분기 로직은 없어서 prod/test는 값 주입 방식만 다르다)
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://localhost:3307/komme?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: komme
      DB_PASSWORD: komme-local-password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_SSL_ENABLED: "false"
      MAIL_HOST: localhost
      MAIL_PORT: "3025"
      MAIL_USERNAME: test@example.com
      MAIL_PASSWORD: test-password
      MAIL_SENDER: test@example.com
      APPLE_CLIENT_ID: com.komme.app.test
      APPLE_JWKS_CACHE_TTL: 1h
      GOOGLE_CLIENT_ID: com.komme.google.app.test
      GOOGLE_JWKS_CACHE_TTL: 1h
      EMAIL_VERIFICATION_CODE_EXPIRATION: 5m
      EMAIL_VERIFICATION_VERIFIED_EXPIRATION: 30m
      EMAIL_VERIFICATION_MAX_ATTEMPTS: "5"
      EMAIL_VERIFICATION_RESEND_COOLDOWN: 1m
      EMAIL_VERIFICATION_LOCK_EXPIRATION: 5m
      JWT_SECRET: ci-only-test-jwt-secret-do-not-use-in-production-0000
      JWT_ACCESS_TOKEN_EXPIRATION: 1h
      JWT_REFRESH_TOKEN_EXPIRATION: 14d
      TOUR_API_SERVICE_KEY: ci-test-tour-api-service-key
      KAKAO_REST_API_KEY: ci-test-kakao-rest-api-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon
